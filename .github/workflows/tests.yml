name: Tests
on: [push, pull_request]
jobs:
  contracts:
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.8.3'
      - run: python -m venv .venv
      - name: Install dependencies (Unix)
        if: runner.os != 'Windows'
        run: .venv/bin/python -m pip install -e '.[dev,render]' build
      - name: Run contracts (Unix)
        if: runner.os != 'Windows'
        run: .venv/bin/python -m pytest -o addopts='' -q -rs
      - name: Build wheel (Unix)
        if: runner.os != 'Windows'
        run: .venv/bin/python -m build --wheel
      - name: Prepare isolated release smoke (macOS)
        if: runner.os == 'macOS'
        run: python scripts/release/prepare-smoke-package.py
      - name: Install final package (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ runner.temp }}/jiaodui-release-smoke
        run: bash install-macos.sh
