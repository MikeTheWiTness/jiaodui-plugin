<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 529" role="img" aria-label="JiaoDuiAgentSkill 结构化报告交付主链"><title>JiaoDuiAgentSkill 结构化报告交付主链</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8d7461"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif}.box-title{font-size:19px;font-weight:650;fill:#35322c}.box-text{font-size:15px;fill:#756c60}.label{font-size:15px;fill:#8d7461}.band{font-size:16px;font-weight:600;fill:#c76a4c}</style><rect width="1200" height="529" rx="20" fill="#faf9f5"/><text x="36" y="34" class="band">正常交付主链 · 三道完成条件</text><rect x="35" y="65" width="260" height="108" rx="14" fill="#fffefa" stroke="#e3dacb" stroke-width="1.5"/><text x="165.0" y="95" text-anchor="middle" class="box-title">01 入口与预检</text><text x="165.0" y="120" text-anchor="middle" class="box-text">确定学科 / 讲义或试卷</text><text x="165.0" y="142" text-anchor="middle" class="box-text">本地环境与宿主视觉门槛</text><rect x="325" y="65" width="260" height="108" rx="14" fill="#fffefa" stroke="#e3dacb" stroke-width="1.5"/><text x="455.0" y="95" text-anchor="middle" class="box-title">02 转换与拆分</text><text x="455.0" y="120" text-anchor="middle" class="box-text">源副本 → raw → 单元</text><text x="455.0" y="142" text-anchor="middle" class="box-text">切片全量覆盖 / 明确节选</text><rect x="615" y="65" width="260" height="108" rx="14" fill="#fffefa" stroke="#e3dacb" stroke-width="1.5"/><text x="745.0" y="95" text-anchor="middle" class="box-title">03 轮次授权与派发</text><text x="745.0" y="120" text-anchor="middle" class="box-text">当前 run 确认执行模式</text><text x="745.0" y="142" text-anchor="middle" class="box-text">路径 + 身份 + 快照</text><rect x="905" y="65" width="260" height="108" rx="14" fill="#fffefa" stroke="#e3dacb" stroke-width="1.5"/><text x="1035.0" y="95" text-anchor="middle" class="box-title">04 单元读取与校对</text><text x="1035.0" y="120" text-anchor="middle" class="box-text">分页读文 / 实际读图</text><text x="1035.0" y="142" text-anchor="middle" class="box-text">实算 → 判断 → 自查</text><rect x="35" y="238" width="260" height="108" rx="14" fill="#fffefa" stroke="#e3dacb" stroke-width="1.5"/><text x="165.0" y="268" text-anchor="middle" class="box-title">08 父复核与正式交付</text><text x="165.0" y="293" text-anchor="middle" class="box-text">当前 snapshot accepted</text><text x="165.0" y="315" text-anchor="middle" class="box-text">整卷 complete / Word 回读</text><rect x="325" y="238" width="260" height="108" rx="14" fill="#fffefa" stroke="#e3dacb" stroke-width="1.5"/><text x="455.0" y="268" text-anchor="middle" class="box-title">07 当前轮次技术登记</text><text x="455.0" y="293" text-anchor="middle" class="box-text">报告 / 数据摘要入清单</text><text x="455.0" y="315" text-anchor="middle" class="box-text">释放槽位，等待父审</text><rect x="615" y="238" width="260" height="108" rx="14" fill="#fffefa" stroke="#e3dacb" stroke-width="1.5"/><text x="745.0" y="268" text-anchor="middle" class="box-title">06 程序生成与统一校验</text><text x="745.0" y="293" text-anchor="middle" class="box-text">从源文插入标记</text><text x="745.0" y="315" text-anchor="middle" class="box-text">逐字还原 + 资源检查</text><rect x="905" y="238" width="260" height="108" rx="14" fill="#fffefa" stroke="#e3dacb" stroke-width="1.5"/><text x="1035.0" y="268" text-anchor="middle" class="box-title">05 定位与 v2 提交</text><text x="1035.0" y="293" text-anchor="middle" class="box-text">证据 + 修改项 + 自查</text><text x="1035.0" y="315" text-anchor="middle" class="box-text">snapshot CAS 拒绝旧版本</text><path d="M295,119 H320" fill="none" stroke="#8d7461" stroke-width="2" marker-end="url(#arrow)"/><path d="M585,119 H610" fill="none" stroke="#8d7461" stroke-width="2" marker-end="url(#arrow)"/><path d="M875,119 H900" fill="none" stroke="#8d7461" stroke-width="2" marker-end="url(#arrow)"/><path d="M1035,173 V232" fill="none" stroke="#8d7461" stroke-width="2" marker-end="url(#arrow)"/><path d="M325,292 H300" fill="none" stroke="#8d7461" stroke-width="2" marker-end="url(#arrow)"/><path d="M615,292 H590" fill="none" stroke="#8d7461" stroke-width="2" marker-end="url(#arrow)"/><path d="M905,292 H880" fill="none" stroke="#8d7461" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="387" width="1130" height="112" rx="14" fill="#fffaf0" stroke="#e3dacb"/><text x="600" y="421" text-anchor="middle" class="box-title">文本与图片通过 → 本轮技术登记 → 当前版本父审 accepted</text><text x="600" y="452" text-anchor="middle" class="box-text">待复核整卷报告可先生成，但 complete=false；Word 只消费有效交付</text><text x="600" y="478" text-anchor="middle" class="box-text">失败进入有限恢复或交人裁定；用户取消停止补位；全过程保留磁盘记录</text></svg>