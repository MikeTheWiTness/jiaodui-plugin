# dsh-jiaodui-chemistry 自带组合包（bundle）patch。
#
# 它声明一个 `jiaodui-chemistry` agent preset，并在 preset 的 plugins 里：
#   1. 把随包的 skills/ 目录挂进 skill-filesystem（只对该 preset 生效）；
#   2. 挂载 ./tools/index.js，注册 jiaodui 原生工具（argv 透传 CLI）；
#   3. 声明子 preset `jiaodui-chemistry-unit`，供 `tool-subagent` 的 agentPreset 引用。
# 本包与高中物理包 dsh-jiaodui 完全独立：可以同时安装、分别启用、互不覆盖；
# 两者共用同一份 Python CLI 与同一套学科无关的原生工具，学科差异只在
# skill 入口、学科配置 `jiaodui/data/subjects/高中化学.json` 与 preset persona。
# 能力分层（真机验收后确定，见 docs/PROCESS_REWORK.md「P2 真机验收」）：
#   父 agent：保留通用操作性——shell（按平台 bash/pwsh）与只读搜索 fs-search。
#     理由是实测出来的：无 shell 的会话能复现 Word 锚点丢失、能收窄到条件，却因为
#     没有任何读 docx 内部 XML 的通道而无法定位根因，只能交接。
#   子 agent：工具目录由独立子 preset「校对（高中化学·单元子代理）」封闭
#     （toolset: unit），无 shell、无 write/edit、无 raw CLI/unit_cancel——
#     「模型不写报告、只交结构化提案」这条硬约束的落点在这里。
# 注意：shell 里不要用 `python -m jiaodui`。editable 安装的查找器排在 PathFinder 之后，
# cwd 决定导入哪条线的 core；确定性操作一律走原生 jiaodui_* 工具，shell 只用于观察与修复。
#
# 安装后可在「设置 → 通用 → agent preset」把默认 preset 换成「校对（高中化学）」，
# 或在新会话里选择它。行 id preset-jiaodui-chemistry 可被 profile patch 按 id 覆盖。
# 子 preset「校对（高中化学·单元子代理）」只供 subagent 引用，不要手动选它。

- insert:
    - id: preset-jiaodui-chemistry
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: jiaodui-chemistry
        name: 校对（高中化学）
        description: 高中化学试卷/讲义校对：加载 jiaodui-chemistry skill，用子 agent 逐单元校对，并做报告校验与 Word 批注交付（配平与计量强制实算）。
        order: 11
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: |-
                你是高中化学试卷/讲义校对流程的调度 agent（模型 {{model}}）。
                先加载 jiaodui-chemistry skill，再按它的流程执行：判断交给模型，确定性交给 jiaodui CLI。
                学科固定为高中化学，只走化学规范；方程式配平与化学计量必须用 calc 工具实算，不得凭经验断言。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          # 聚合fs暂保留：宿主read_image来自该插件。细粒度读写过滤尚待宿主支持。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              # preset 行的挂载基准是 profile 根（agent-preset-registry 的 ctx.baseUrl），
              # 不是本 patch 所在目录，所以不能用 ./skills；按 DSH 自带 bundle 的写法，
              # 用 createRequire(baseUrl) 反查包的真实路径。
              customSkillDirs:
                - !!js >-
                    process.getBuiltinModule('node:path').join(
                      process.getBuiltinModule('node:path').dirname(
                        process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-jiaodui-chemistry/package.json')),
                      'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          # jiaodui 原生工具：argv 透传 CLI。裸包名从 profile 解析（exports["."] = ./tools/index.js），
          # 相对路径会以 profile 根为基准而 import 不到（never started）。
          # 本包与 dsh-jiaodui 挂载的是同一套学科无关工具模块；两包的副本由测试守字节一致，
          # 避免「化学包改了工具行为、物理包没改」这类隐性分叉。
          - id: jiaodui-tools
            name: dsh-jiaodui-chemistry
            config:
              timeoutMs: 180000
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
            disabled: true
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
            disabled: true
          - id: planning
            name: cordis:group
            group: true
            disabled: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  maxDepth: 1
                  # 0.2.1 起 tool-subagent 不再接受 toolFilter/persona：子代理的工具面
                  # 由独立子 preset 决定，这里只指定默认子 preset。
                  agentPreset: jiaodui-chemistry-unit
              - id: tool-subagent-fork
                disabled: true
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                disabled: true
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
                disabled: true
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            disabled: true
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: native
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
    # 子 preset：只由 parent preset 的 tool-subagent 通过 agentPreset 引用。
    # 不挂 agent-instructions：单元任务规则在 SKILL.md 与派发 prompt 里，避免仓库开发约定占子代理上下文。
    - id: preset-jiaodui-chemistry-unit
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: jiaodui-chemistry-unit
        name: 校对（高中化学·单元子代理）
        description: 高中化学单元校对子代理的封闭工具集：只读源文/图片、加载 jiaodui-chemistry skill、提交结构化提案，配平与计量必须实算；只由「校对（高中化学）」preset 的 subagent 调用。
        order: 13
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: |-
                你是高中化学单元校对子代理，只按 jiaodui-chemistry skill 的单元流程工作：
                用 jiaodui_unit_read 分页读源文，用 read_image 看图片，配平与计量必须用 jiaodui_calc_* 实算；
                只提交结构化提案，不写报告、不改源文、不取消单元。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              # 与父 preset 一样，用 createRequire(baseUrl) 反查包的真实路径。
              customSkillDirs:
                - !!js >-
                    process.getBuiltinModule('node:path').join(
                      process.getBuiltinModule('node:path').dirname(
                        process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-jiaodui-chemistry/package.json')),
                      'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          # 子代理只读：read/read_image 来自聚合 fs，write/edit 明确关闭。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: true
              write: false
              edit: false
          # toolset: unit 只注册 unit_* 读取/定位/快照/提交/恢复/心跳 + calc_*；
          # 化学的配平/计量 calc operation 也在 calc_* 内，不需要额外放行名单。
          - id: jiaodui-tools
            name: dsh-jiaodui-chemistry
            config:
              timeoutMs: 180000
              toolset: unit
          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: native
