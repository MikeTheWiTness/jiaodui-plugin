# dsh-jiaodui 自带组合包（bundle）patch。
#
# 它声明一个 `jiaodui` agent preset，并在 preset 的 plugins 里：
#   1. 把随包的 skills/ 目录挂进 skill-filesystem（只对该 preset 生效）；
#   2. 挂载 ./tools/index.js，注册 jiaodui 原生工具（argv 透传 CLI）。
# 公共能力以 standard preset 为底座；此 profile 关闭 web / goal / plan / fork，
# 保留 filesystem、图片读取、旧报告写入与 jiaodui CLI。子代理 toolFilter 仅按宿主暴露
# 的工具目录过滤，不把它宣称为严格权限隔离；需等第 7 章独立实验完成再收紧。
#
# 安装后可在「设置 → 通用 → agent preset」把默认 preset 换成「校对」，
# 或在新会话里选择它。行 id preset-jiaodui 可被 profile patch 按 id 覆盖。

- insert:
    - id: preset-jiaodui
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: jiaodui
        name: 校对
        description: K-12 试卷/讲义校对：加载 jiaodui skill，用子 agent 逐单元校对，并做报告校验与 Word 批注交付（当前只落地高中物理）。
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: |-
                你是 K-12 试卷/讲义校对流程的调度 agent（模型 {{model}}）。
                先加载 jiaodui skill，再按它的流程执行：判断交给模型，确定性交给 jiaodui CLI。
                当前只落地高中物理；其他学科未落地时明确说明，不要回退套用物理流程。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              # preset 行挂载基准是 profile 根；只从本组合包 customSkillDirs 加载 skill。
              customSkillDirs:
                - !!js >-
                    process.getBuiltinModule('node:path').join(
                      process.getBuiltinModule('node:path').dirname(
                        process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-jiaodui/package.json')),
                      'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: jiaodui-tools
            name: dsh-jiaodui
            config:
              timeoutMs: 180000
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
            disabled: true
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
            disabled: true
          - id: planning
            name: cordis:group
            group: true
            disabled: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
                  maxDepth: 1
                  toolFilter:
                    allow: [skill, read, read_image, write, edit, jiaodui]
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                disabled: true
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
                disabled: true
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            disabled: true
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: native
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
